const NAV = [

function badgeHtml(b){
  if(!b) return '';
  if(b.text){
    return `<span class="rounded-full bg-nav-active px-1.5 py-0.5 font-mono text-[9px] font-semibold uppercase tracking-wide text-nav">${b.text}</span>`;

  return `<span class="flex h-5 min-w-5 items-center justify-center rounded-full px-1 font-mono text-[11px] font-medium ${tones[b.tone]}">${b.n}</span>`;
}

        <span class="label-fade flex-1">${item.label}</span>
        <svg class="chev ${item.open ? 'open' : ''}" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="navgroup ${item.open ? 'open' : ''}" data-groupbody="${item.id}">

    </div>`;
  }).join('');

  el.querySelectorAll('.navgrouptoggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.group;

      item.open = !item.open;
      renderNav();
    });
  });
  el.querySelectorAll('[data-child]').forEach(btn => {
    btn.addEventListener('click', () => {
      const [, childId] = btn.dataset.child.split('.');
      if(childId === 'review'){ activeFilter = 'review'; }
      else if(childId === 'all'){ activeFilter = 'all'; }
      else if(childId === 'stations'){ /* already the merged view — no-op */ }
      NAV.find(n=>n.id==='captures').children.forEach(c => c.active = c.id === childId || (childId==='all' && c.id==='all'));
      renderNav(); renderAll();
    });
  });
}

/* ============================================================
   CAPTURE EVENTS — now carrying a station reference so the
   list, the detail pane, and the network strip all agree.
   ============================================================ */
function tile(seed, hue){
  const c = document.createElement('canvas'); c.width=160; c.height=160;
  const ctx = c.getContext('2d'); let s = seed;
  const rnd = () => { s = (s*1103515245+12345) & 0x7fffffff; return s/0x7fffffff; };
  ctx.fillStyle = `hsl(${hue} 20% ${16+rnd()*10}%)`; ctx.fillRect(0,0,160,160);
  for(let i=0;i<7;i++){
    ctx.strokeStyle = `hsla(${hue+(rnd()*20-10)} 14% 7% / ${.4+rnd()*.3})`;
    ctx.lineWidth = 4+rnd()*6;
    ctx.beginPath();
    const x = rnd()*160;
    ctx.moveTo(x,0); ctx.quadraticCurveTo(x+(rnd()*40-20),80,x+(rnd()*30-15),160);
    ctx.stroke();
  }
  return c.toDataURL();
}

  { id:'EVT-0505', cam:'CAM-09', start:'23:58:02', end:null, dur:'single frame', frames:1, type:'photo', status:'reject', candidates:[], hue:34 },
];

let activeFilter = 'all';
let activeStation = null;
let activeId = EVENTS[0].id;

function visibleEvents(){
  return EVENTS.filter(e =>
    (activeFilter==='all' || e.status===activeFilter) &&
    (!activeStation || e.cam===activeStation)

}

function renderStatRow(){
  const review = EVENTS.filter(e=>e.status==='review').length;
  const matched = EVENTS.filter(e=>e.status==='matched').length;
  const offline = Object.values(STATIONS).filter(s => s.status !== 'OPERATIONAL').length;
  const uptime = Math.round((Object.keys(STATIONS).length - offline) / Object.keys(STATIONS).length * 100);
  const blocks = [
    { label:'Needs review', value:review, tone:'text-caution' },
    { label:'Auto-matched', value:matched, tone:'text-positive' },
    { label:'Total events', value:EVENTS.length, tone:'text-foreground' },
    { label:'Network uptime', value:uptime+'%', tone: offline>0 ? 'text-caution' : 'text-positive', hint: offline>0 ? `${offline} camera${offline>1?'s':''} need attention` : 'All cameras reporting' },
  ];
  document.getElementById('statRow').innerHTML = blocks.map(b => `
    <div class="relative overflow-hidden rounded-xl border ${b.hint && offline>0 && b.label==='Network uptime' ? 'border-caution/40 bg-caution-soft' : 'border-border bg-surface'} p-4">

function renderStationStrip(){
  const strip = document.getElementById('stationStrip');
  strip.innerHTML = Object.entries(STATIONS).map(([id, s]) => {
    const st = STATION_STATE[s.status];
    const active = activeStation === id;
    return `
    <button data-station="${id}" class="stationChip flex shrink-0 items-center gap-2 rounded-full border px-3 py-1.5 text-left transition-colors ${
      active ? 'border-accent-strong bg-accent text-accent-foreground' : 'border-border bg-surface hover:border-border-strong'
    }">
      <span class="relative flex h-2 w-2 shrink-0 rounded-full ${st.dot} ${s.status==='OFFLINE' ? 'dot-pulse text-danger' : ''}"></span>
      <span class="font-mono text-xs font-medium ${active ? 'text-accent-foreground' : 'text-foreground'}">${id}</span>
      ${s.status !== 'OPERATIONAL' ? `<span class="font-mono text-[10px] ${active ? 'text-accent-foreground/80' : 'text-muted'}">${st.label}</span>` : ''}
    </button>`;
  }).join('');
  strip.querySelectorAll('.stationChip').forEach(b => b.addEventListener('click', () => {
    activeStation = activeStation === b.dataset.station ? null : b.dataset.station;
    renderAll();
  }));
}

function renderStationCard(){
  const box = document.getElementById('stationCard');
  if(!activeStation){ box.innerHTML=''; return; }
  const s = STATIONS[activeStation];
  const st = STATION_STATE[s.status];
  box.innerHTML = `
    <div class="flex flex-wrap items-center justify-between gap-4 rounded-2xl border border-border bg-surface p-4">
      <div class="flex items-center gap-4">
        <div class="flex h-11 w-11 items-center justify-center rounded-full ${st.bg} ${st.text}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="15" height="12" rx="2"/><path d="m17 10 5-3v10l-5-3"/></svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-mono text-base font-semibold text-foreground">${activeStation}</span>
            <span class="rounded-full px-2 py-0.5 font-mono text-[10px] font-semibold ${st.bg} ${st.text}">${st.label}</span>
          </div>
          <div class="mt-0.5 text-xs text-muted">${s.zone} — ${s.region}</div>
        </div>
      </div>
      <div class="flex items-center gap-5 font-mono text-xs text-muted">
        <span>${s.battery !== null ? s.battery+'% battery' : 'battery unknown'}</span>
        <span>${s.trapNights} trap-nights</span>
        <span>${s.individuals} individuals seen here</span>
      </div>
      <button class="text-xs font-medium text-muted hover:text-foreground" onclick="activeStation=null;renderAll()">Clear filter ✕</button>
    </div>`;
}

function renderFilters(){
  const FILTERS = [
    { id:'all', label:'All events' },
    { id:'review', label:'Needs review' },
    { id:'matched', label:'Auto-matched' },
    { id:'new', label:'Unidentified' },
    { id:'reject', label:'Blank / rejected' },
  ];
  document.getElementById('filterRow').innerHTML = FILTERS.map(f => {
    const n = f.id==='all' ? EVENTS.filter(e=>!activeStation||e.cam===activeStation).length : EVENTS.filter(e=>e.status===f.id && (!activeStation||e.cam===activeStation)).length;
    return `
    <button data-f="${f.id}" class="rounded-full border px-3.5 py-1.5 text-sm font-medium transition-colors ${
      activeFilter===f.id ? 'border-accent-strong bg-accent text-accent-foreground' : 'border-border text-muted hover:border-border-strong hover:text-foreground'
    }">${f.label} <span class="font-mono text-xs ${activeFilter===f.id ? 'opacity-80' : 'opacity-60'}">${n}</span></button>`;
  }).join('');
  document.querySelectorAll('#filterRow button').forEach(b => b.addEventListener('click', () => { activeFilter=b.dataset.f; renderAll(); }));
}

function thumbHtml(ev){
  if(ev.frames === 1){
    return `<div class="h-14 w-14 shrink-0 overflow-hidden rounded-lg bg-surface-sunken"><img src="${tile(ev.id.length*13, ev.hue)}" class="h-full w-full object-cover" /></div>`;
  }
  const imgs = [0,1,2].map(i => `<img src="${tile(ev.id.length*13+i*7, ev.hue)}" class="absolute h-[46px] w-[46px] rounded-lg border-2 border-surface object-cover shadow-sm" style="top:${i*3}px;left:${i*3}px;z-index:${3-i};filter:brightness(${1-i*.06})" />`).join('');
  const badge = ev.type==='video'
    ? `<span class="absolute -bottom-0.5 -right-1 z-10 flex h-5 w-5 items-center justify-center rounded-full border-2 border-surface bg-accent text-white"><svg width="8" height="8" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>`
    : `<span class="absolute -bottom-0.5 -right-1.5 z-10 rounded-full border-2 border-surface bg-foreground px-1.5 font-mono text-[10px] font-semibold text-white">×${ev.frames}</span>`;
  return `<div class="relative h-14 w-14 shrink-0">${imgs}${badge}</div>`;
}

function renderList(){
  const list = document.getElementById('eventList');
  const items = visibleEvents();
  if(items.length === 0){
    list.innerHTML = `<div class="flex min-h-56 flex-col items-center justify-center rounded-2xl border border-dashed border-border-strong text-center">
      <p class="text-[15px] font-medium text-foreground">No events match this filter</p>
      <p class="mt-1 text-sm text-muted">Try a different status or clear the station filter</p>
    </div>`;
    return;
  }
  list.innerHTML = items.map((ev,i) => {
    const s = STATUS[ev.status];
    const st = STATION_STATE[STATIONS[ev.cam].status];
    const time = ev.end ? `${ev.start} – ${ev.end.slice(-5)}` : ev.start;
    return `
    <button data-id="${ev.id}" style="animation-delay:${Math.min(i*30,300)}ms" class="stagger flex w-full items-center gap-4 rounded-xl border-l-4 bg-surface p-4 text-left transition-colors ${
      activeId===ev.id ? `${s.railBorder} ${s.bg}` : 'border-l-border-strong hover:border-l-border'
    }">
      ${thumbHtml(ev)}
      <div class="min-w-0 flex-1">
        <div class="flex items-center gap-2">
          <span class="rounded-full px-2 py-0.5 font-mono text-[10px] font-semibold uppercase tracking-wide ${s.bg} ${s.text}">${s.label}</span>
          <span class="flex items-center gap-1.5 truncate text-sm font-medium text-foreground">
            <span class="h-1.5 w-1.5 shrink-0 rounded-full ${st.dot}"></span>
            ${ev.cam} · ${STATIONS[ev.cam].zone.split('—')[0].trim()}
          </span>
        </div>
        <p class="mt-1 truncate text-xs text-muted">${time} · ${ev.dur}${ev.frames>1 ? ` · ${ev.frames} ${ev.type==='video'?'frames':'shots'} grouped` : ''}</p>
      </div>
    </button>`;
  }).join('');
  list.querySelectorAll('button[data-id]').forEach(b => b.addEventListener('click', () => { activeId=b.dataset.id; renderDetail(); renderList(); }));
}

function renderDetail(){
  const pane = document.getElementById('detailPane');
  const ev = visibleEvents().find(e => e.id === activeId) || visibleEvents()[0];
  if(!ev){ pane.innerHTML = `<div class="flex min-h-75 flex-col items-center justify-center rounded-2xl border border-dashed border-border-strong text-center text-muted"><p class="mt-3 text-sm">Select an event to review</p></div>`; return; }
  activeId = ev.id;
  const s = STATUS[ev.status];
  const station = STATIONS[ev.cam];
  const st = STATION_STATE[station.status];
  const frames = Array.from({length: ev.frames}, (_,i) => tile(ev.id.length*13+i*11, ev.hue));

  const bannerText = ev.status==='matched'
    ? `<b>Auto-matched to ${ev.candidates[0].id}</b> — ${Math.round(ev.candidates[0].sim*100)}% similarity, above the 82% auto-accept floor.`
    : ev.status==='review'
      ? `<b>Below auto-accept threshold</b> — top candidate ${ev.candidates[0].id} at ${Math.round(ev.candidates[0].sim*100)}%. Needs a human decision.`
      : ev.status==='new'
        ? `<b>No confident candidate</b> — best match only ${Math.round(ev.candidates[0].sim*100)}%. Likely an unenrolled individual.`
        : `<b>No stripe pattern detected</b> — frame appears blank or non-tiger.`;

  const candidatesHtml = ev.candidates.length ? `
    <div class="mt-5 mb-2 font-mono text-[11px] uppercase tracking-wide text-muted">Closest candidates</div>
    <div class="space-y-2">
      ${ev.candidates.slice(0,4).map((c,i) => `
        <button class="group flex w-full items-center gap-3 rounded-lg border px-3 py-2.5 text-left transition-colors hover:border-positive/40 hover:bg-positive-soft ${i===0 ? 'border-border-strong bg-surface-sunken' : 'border-border'}">
          <span class="font-mono text-sm font-medium text-foreground w-16">${c.id}</span>
          <div class="h-1.5 flex-1 overflow-hidden rounded-full bg-surface-sunken"><div class="h-full rounded-full bg-accent" style="width:${c.sim*100}%"></div></div>
          <span class="w-10 text-right font-mono text-xs text-muted">${Math.round(c.sim*100)}%</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-positive opacity-0 transition-opacity group-hover:opacity-100"><path d="M20 6 9 17l-5-5"/></svg>
        </button>
      `).join('')}
    </div>
    <button class="mt-5 flex w-full items-center justify-center gap-2 rounded-full bg-accent px-4 py-2.5 text-sm font-medium text-accent-foreground transition-opacity hover:opacity-90">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></svg>
      None of these — enroll as new individual
    </button>
  ` : `
    <div class="mt-5 rounded-xl border border-border bg-surface-sunken p-3 text-xs text-muted">No candidates cleared the review floor. This event will drop into Blank Frame Trash unless restored.</div>
    <button class="mt-5 flex w-full items-center justify-center gap-2 rounded-full bg-surface border border-border px-4 py-2.5 text-sm font-medium text-foreground transition-colors hover:border-border-strong">Restore to review queue</button>
  `;

  pane.innerHTML = `
    <div class="detail-enter overflow-hidden rounded-2xl border border-border bg-surface">
      <div class="flex items-center justify-between border-b border-border px-5 py-4">
        <span class="rounded-full px-2.5 py-1 font-mono text-[11px] font-semibold uppercase tracking-wide ${s.bg} ${s.text}">${s.label}</span>
        <span class="font-mono text-[11px] text-muted">${ev.id}</span>
      </div>

      <div class="flex gap-2 overflow-x-auto bg-surface-sunken/40 p-3">
        ${frames.map((src,i) => `<img data-i="${i}" src="${src}" class="film h-16 w-16 shrink-0 cursor-pointer rounded-lg object-cover ring-2 ${i===0 ? 'ring-accent' : 'ring-transparent opacity-70 hover:opacity-100'}" />`).join('')}
      </div>

      <img id="mainPreview" src="${frames[0]}" alt="" class="aspect-video w-full bg-surface-sunken object-cover" />

      <div class="p-5">
        <h3 class="text-base font-semibold text-foreground">${ev.cam} · ${station.zone} — ${station.region}</h3>
        <p class="mt-1 text-sm text-muted">${bannerText}</p>

        <div class="mt-4 flex flex-col gap-2 font-mono text-xs text-muted">
          <div class="flex items-center gap-2"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg><span>${ev.end ? ev.start+' – '+ev.end.slice(-5) : ev.start} · ${ev.dur}${ev.frames>1 ? ` · ${ev.frames} ${ev.type==='video'?'frames':'shots'} auto-grouped by camera + trigger window` : ''}</span></div>
        </div>

        <!-- station health, inline, not a separate page -->
        <div class="mt-4 flex items-center justify-between gap-3 rounded-xl border border-border bg-surface-sunken p-3">
          <div class="flex items-center gap-2.5">
            <span class="h-2 w-2 rounded-full ${st.dot}"></span>
            <span class="text-xs text-foreground"><b class="font-medium">${station.status==='OPERATIONAL' ? 'Camera healthy' : st.label}</b> · ${station.battery !== null ? station.battery+'% battery' : 'battery unknown'} · ${station.trapNights} trap-nights</span>
          </div>
          <button onclick="activeStation='${ev.cam}';renderAll()" class="shrink-0 text-xs font-medium text-accent hover:underline">Filter to this camera →</button>
        </div>

        ${candidatesHtml}
      </div>
    </div>
  `;
  pane.querySelectorAll('.film').forEach(img => img.addEventListener('click', () => {
    pane.querySelectorAll('.film').forEach(x => { x.classList.remove('ring-accent'); x.classList.add('ring-transparent','opacity-70'); });
    img.classList.remove('ring-transparent','opacity-70');
    img.classList.add('ring-accent');
    document.getElementById('mainPreview').src = img.src;
  }));
}

function renderAll(){
  renderStatRow();
  renderOfflineBanner();
  renderStationStrip();
  renderStationCard();
  renderFilters();
  renderList();
  renderDetail();
}
renderAll();
</script>
</body>
</html>
